# Stage 7: auto-merge a work-item PR once its real gate (the "required" job) passes - no manual
# click, no manual branch update (ADR-0019). Scoped to label `agent` (builder PRs) only: the spec
# PR (plan gate) and the design PR (idea sign-off) stay human-merged, on purpose. The merge itself
# goes through publish.yml (the one place that writes a PR), never a `gh pr merge` here.
#
# Needs the factory-bot App added as a bypass actor on the review ruleset
# (factory-default-branch-review): the App is a different actor than the PR's own author, so the
# normal self-review rule is not what blocks it - nothing today grants it (or anything but the
# Admin role) permission to merge without a formal approval. That ruleset edit is a standing
# governance change outside what this workflow may do for itself; see ADR-0019 and HANDOFF.md for
# the exact command Qun runs once, by hand.
name: 55 merge
on:
  workflow_run:
    workflows: ["50 review"]
    types: [completed]
permissions: {}
jobs:
  check:
    if: >-
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      pr: ${{ steps.pr.outputs.number }}
      merge: ${{ steps.update.outputs.merge }}
    steps:
      - name: Spend merge budget on required's own result, not the raw run conclusion
        id: required
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          conclusions=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/jobs" --jq '.jobs[] | select(.name == "required") | .conclusion')
          n=$(printf '%s\n' "$conclusions" | grep -c .)
          [ "$n" -eq 1 ] || { echo "::error::expected exactly one 'required' job on run $RUN_ID, found $n"; exit 1; }
          [ "$conclusions" = success ] && passed=true || passed=false
          echo "passed=$passed" >> "$GITHUB_OUTPUT"
      - name: Find the PR this verify run belongs to, and stop unless it is agent-labelled and open
        id: pr
        if: steps.required.outputs.passed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          pr=$(gh api "repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA/pulls" --jq '.[0] | select(.state == "open") | .number')
          [ -n "$pr" ] || exit 0
          labelled=$(gh pr view "$pr" -R "$GITHUB_REPOSITORY" --json labels --jq '[.labels[].name] | contains(["agent"])')
          [ "$labelled" = "true" ] || exit 0
          echo "number=$pr" >> "$GITHUB_OUTPUT"
      - name: Mint the factory-bot App token to read and, if stale, update the branch
        if: steps.pr.outputs.number != ''
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.FACTORY_APP_CLIENT_ID }}
          private-key: ${{ secrets.FACTORY_APP_PRIVATE_KEY }}
          permission-pull-requests: write
          permission-contents: write
      - name: Update a stale branch instead of leaving it for a person to notice
        id: update
        if: steps.pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          PR: ${{ steps.pr.outputs.number }}
        run: |
          state=$(gh pr view "$PR" -R "$GITHUB_REPOSITORY" --json mergeStateStatus --jq .mergeStateStatus)
          if [ "$state" = "BEHIND" ]; then
            echo "::notice::PR #$PR is behind master; updating its branch, required will re-run on the new head"
            gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/update-branch" -X PUT
            echo "merge=false" >> "$GITHUB_OUTPUT"
          else
            echo "merge=true" >> "$GITHUB_OUTPUT"
          fi

  merge:
    needs: check
    if: >-
      github.event.workflow_run.head_repository.full_name == github.repository &&
      needs.check.outputs.merge == 'true'
    permissions: {}
    uses: ./.github/workflows/publish.yml
    with:
      client_id: ${{ vars.FACTORY_APP_CLIENT_ID }}
      merge_pr: ${{ needs.check.outputs.pr }}
    secrets:
      FACTORY_APP_PRIVATE_KEY: ${{ secrets.FACTORY_APP_PRIVATE_KEY }}
