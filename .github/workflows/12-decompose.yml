# Stage 2 -> 1: after a design idea's PR is merged by a person (ADR-0018), turn its "Proposed features"
# list into draft feature issues. Runs from master AFTER the merge (push), so no PR-controlled code ever
# runs with the App token (AI review of PR #30, finding #4). No agent, no gate label: a product owner
# still approves each feature (ADR-016).
name: 12 decompose
on:
  push:
    branches: [master]
    paths: ["docs/design/D*/design.md"]
permissions: {}
jobs:
  decompose:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.FACTORY_APP_CLIENT_ID }}
          private-key: ${{ secrets.FACTORY_APP_PRIVATE_KEY }}
          permission-issues: write
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Create feature issues for each design doc this push added or changed (idempotent by title)
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: python3 tools/decompose.py --changed-since HEAD^
