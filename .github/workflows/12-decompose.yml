# Stage 2 -> 1: once a design idea's PR is merged (a person's sign-off, never auto-merged - ADR-0018),
# turn its "Proposed features" list into draft feature issues. No agent runs here and no gate label
# is set - a product owner still approves each one before 08-design/10-spec can touch it (ADR-016).
name: 12 decompose
on:
  pull_request:
    types: [closed]
permissions: {}
jobs:
  decompose:
    if: github.event.pull_request.merged == true && contains(github.event.pull_request.labels.*.name, 'design')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Extract the design idea's issue number from its branch name
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          [[ "$BRANCH" =~ ^design/D([1-9][0-9]*)$ ]] || { echo "::error::not a design branch: $BRANCH"; exit 1; }
          echo "ISSUE=${BASH_REMATCH[1]}" >> "$GITHUB_ENV"
      - id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.FACTORY_APP_CLIENT_ID }}
          private-key: ${{ secrets.FACTORY_APP_PRIVATE_KEY }}
          permission-issues: write
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          persist-credentials: false
      - name: Create feature issues from the merged design doc (factory-bot App token)
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: python3 tools/decompose.py --design-md "docs/design/D${ISSUE}/design.md" --issue "$ISSUE"
