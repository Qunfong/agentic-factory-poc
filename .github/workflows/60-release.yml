# Stage 7: release. Staging is automatic; production needs the release owner
# (GitHub environment "production" with required reviewers and "prevent self-review") -
# not enforceable on a private Free repo today (no environment reviewers, one collaborator);
# see ADR-0017. The production job below still fails closed rather than skipping the check.
name: 60 release
on:
  push:
    branches: [master]
    paths: ["app/**"]
permissions:
  contents: read
jobs:
  release-record:
    # Who merged the PR that triggered this (inert data, Q60 option b; R4 stays open, ADR-0017).
    # Its own job, its own minimal scope (PR #42 review, #10): nothing else in this workflow needs
    # pull-requests: read, so it must not inherit it just by sharing a job with something that does.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: "Release record"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::GITHUB_SHA is not a 40-hex commit id"; exit 1; }
          merged_by=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq '.[0].merged_by.login // "unknown"')
          jq -n --arg sha "$GITHUB_SHA" --arg run_id "$GITHUB_RUN_ID" --arg merged_by "$merged_by" \
            --arg at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{commit: $sha, run_id: $run_id, merged_by: $merged_by, recorded_at: $at}' \
            | tee release-record.json
      - uses: actions/upload-artifact@v4
        with:
          name: release-record-${{ github.run_id }}
          path: release-record.json
          retention-days: 7
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 50}
      - name: "Run-record check - every agent commit carries a Factory-Run trailer"
        env:
          BEFORE: ${{ github.event.before }}
        run: python3 tools/check_run_records.py --since "$BEFORE"
      # No Maven cache: an agent job could have written into the default branch's cache scope (Q10).
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "21"}
      - run: mvn -B -f app/pom.xml package -DskipTests
      - id: meta
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}/meter-service:${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with: {registry: ghcr.io, username: "${{ github.actor }}", password: "${{ github.token }}"}
      - env:
          IMAGE: ${{ steps.meta.outputs.image }}
        run: |
          docker build -t "$IMAGE" app
          docker push "$IMAGE"
  staging:
    needs: build
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - env:
          IMAGE: ${{ needs.build.outputs.image }}
        run: echo "Deploy $IMAGE to staging (replace with your deploy step)"
  production:
    needs: [build, staging]
    runs-on: ubuntu-latest
    environment: production      # release gate: required reviewer = release owner
    steps:
      # GitHub auto-creates a missing environment without protection, and a private Free repo
      # cannot add reviewers; a missing gate must stop the deploy, not pass it (ANSWERS, 2026-11-12).
      - name: Fail closed unless production has a required reviewer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rules=$(gh api "repos/$GITHUB_REPOSITORY/environments/production" --jq '[.protection_rules[]?.type] | join(",")') \
            || { echo "::error::cannot read the production environment; refusing to deploy"; exit 1; }
          case ",$rules," in
            *,required_reviewers,*) echo "production has a required reviewer" ;;
            *) echo "::error::production has no required reviewer (rules: ${rules:-none}); refusing to deploy"; exit 1 ;;
          esac
      - env:
          IMAGE: ${{ needs.build.outputs.image }}
        run: echo "Deploy $IMAGE to production behind a feature flag (replace with your deploy step)"
