# Stage 1 -> 2, one level above a feature: intent gate (label set by a product owner) starts the
# design writer. Produces a design doc and ADR proposals for sign-off, never auto-merged (ADR-0019).
name: 08 design
on:
  issues:
    types: [labeled]
concurrency:
  group: design-${{ github.event.issue.number }}
  cancel-in-progress: false
permissions: {}
jobs:
  authorize:
    if: github.event.label.name == 'gate:intent-approved' && contains(github.event.issue.labels.*.name, 'design')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Only a person with the product-owner gate role may set this label (ADR-016)
        env:
          GATE_ROLES: ${{ vars.GATE_ROLES }}
          ACTOR: ${{ github.event.sender.login }}
          ISSUE: ${{ github.event.issue.number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          allowed=$(echo "$GATE_ROLES" | jq -r '."gate:intent-approved"[]?')
          if ! printf '%s\n' "$allowed" | grep -Fxq -- "$ACTOR"; then
            gh issue edit "$ISSUE" -R "$GITHUB_REPOSITORY" --remove-label gate:intent-approved
            gh issue comment "$ISSUE" -R "$GITHUB_REPOSITORY" --body "Gate label removed: @$ACTOR does not hold the intent gate role."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Only the factory bot, a maintainer or an admin may start an agent (brief 009)
        env:
          GH_TOKEN: ${{ github.token }}
          FACTORY_BOT_LOGIN: ${{ vars.FACTORY_BOT_LOGIN }}
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          EVENT: ${{ github.event_name }}
        run: python3 tools/authorize.py --event "$EVENT" "$ACTOR" "$TRIGGERING_ACTOR"
      - name: Fail now, not mid-run, when the design writer's credentials are missing (presence only)
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' && 'set' || '' }}
        run: python3 tools/check_secrets_env.py --role design-writer

  prepare:
    needs: authorize
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      base_sha: ${{ steps.base.outputs.sha }}
    steps:
      - id: base
        name: Record the base commit before any agent runs
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: design/D${{ github.event.issue.number }}
        run: |
          sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$BRANCH" --jq .object.sha 2>/dev/null) || sha="$GITHUB_SHA"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::could not resolve the base commit of $BRANCH"; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  design:
    needs: [authorize, prepare]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.base_sha }}
          persist-credentials: false
      - name: Load only the design writer's pinned on-trigger skills into .claude/skills (briefs 001, 010)
        run: python3 tools/load_skills.py design-writer
      - name: Prepare prompt (always-on skills inlined, brief 010)
        env:
          ISSUE: ${{ github.event.issue.number }}
          TITLE: ${{ github.event.issue.title }}
          BODY: ${{ github.event.issue.body }}
        run: |
          {
            python3 tools/build_prompt.py design-writer
            echo; echo "## Design idea #$ISSUE: $TITLE"
            echo '<untrusted-issue-text>'; echo "$BODY"; echo '</untrusted-issue-text>'
          } > "$RUNNER_TEMP/prompt.md"
          echo "PROMPT_FILE=$RUNNER_TEMP/prompt.md" >> "$GITHUB_ENV"
      - name: Design writer (Claude, read-only token)
        uses: anthropics/claude-code-action@v1
        env:
          # Debug mode would print the full transcript to the public log, whatever show_full_output says.
          ACTIONS_STEP_DEBUG: "false"
        with:
          show_full_output: false
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          prompt: "${{ format('Follow the instructions in the file {0}. Design idea number: {1}.', env.PROMPT_FILE, github.event.issue.number) }}"
          claude_args: >-
            --model claude-opus-5-5 --max-turns 40
            --allowedTools "Read,Glob,Grep,Skill,Write(docs/design/D${{ github.event.issue.number }}/**),Edit(docs/design/D${{ github.event.issue.number }}/**),Write(docs/adr/proposed-*.md),Edit(docs/adr/proposed-*.md),Bash(git status),Bash(git diff:*)"
      - name: Hand over the change as a patch (publish guards, commits and pushes it)
        env:
          BASE_SHA: ${{ needs.prepare.outputs.base_sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          git add -A
          git diff --cached --binary --full-index "$BASE_SHA" > "$RUNNER_TEMP/out/changes.patch"
      - uses: actions/upload-artifact@v4
        with:
          name: patch-design-writer
          path: ${{ runner.temp }}/out/changes.patch
          if-no-files-found: error
          retention-days: 7

  design-record:
    # Its own job: after the agent step, the agent's job and checkout can't be trusted (QUESTIONS Q19).
    needs: [prepare, design]
    if: ${{ always() && needs.prepare.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.base_sha }}
      - name: Run record (tool from this workflow's own commit)
        env:
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          ISSUE: ${{ github.event.issue.number }}
          AGENT_STATUS: ${{ needs.design.result }}
        run: |
          [[ "$WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::github.workflow_sha is not a commit id: '$WORKFLOW_SHA'"; exit 1; }
          git cat-file -e "$WORKFLOW_SHA^{commit}" 2>/dev/null || git fetch -q --no-tags --depth 1 origin "$WORKFLOW_SHA"
          git show "$WORKFLOW_SHA:tools/run_record.py" > "$RUNNER_TEMP/run_record.py"
          python3 "$RUNNER_TEMP/run_record.py" --role design-writer --issue "$ISSUE" --model anthropic/claude-opus-5-5 --status "$AGENT_STATUS"
      - uses: actions/upload-artifact@v4
        with:
          name: run-record-design-${{ github.run_id }}
          path: run-record.json
          retention-days: 7

  publish:
    needs: [prepare, design]
    permissions: {}
    uses: ./.github/workflows/publish.yml
    with:
      role: design-writer
      issue: ${{ github.event.issue.number }}
      base_sha: ${{ needs.prepare.outputs.base_sha }}
      client_id: ${{ vars.FACTORY_APP_CLIENT_ID }}
    secrets:
      FACTORY_APP_PRIVATE_KEY: ${{ secrets.FACTORY_APP_PRIVATE_KEY }}
